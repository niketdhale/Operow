[package]
name = "operow-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "operow"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_extras = "0.33"
egui-flow = { git = "https://github.com/niketdhale/egui-flow", rev = "3daa9fe45a08c0447e377fde79e806e7c7264f0f" }
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
operow-core = { workspace = true }
operow-engine = { path = "../operow-engine" }
