[package]
name = "operow-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "operow"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui_extras = "0.33"
egui-snarl = "0.9"
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
operow-core = { workspace = true }
operow-engine = { path = "../operow-engine" }
