[package]
name = "operow-app"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "operow"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
egui_extras = { version = "0.33", features = ["svg"] }
egui-flow = { git = "https://github.com/niketdhale/egui-flow", rev = "ce28d5cb9a6033bd955a757ca098af2582a3de42" }
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
operow-core = { workspace = true }
operow-uds = { path = "../operow-uds" }
operow-isotp = { path = "../operow-isotp" }
operow-log = { path = "../operow-log" }
operow-engine = { path = "../operow-engine" }
operow-hw = { path = "../operow-hw" }
operow-dbc = { path = "../operow-dbc" }
operow-project = { path = "../operow-project" }
operow-test = { path = "../operow-test" }
egui_dock = { version = "0.18", features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
egui_plot = "0.34"
