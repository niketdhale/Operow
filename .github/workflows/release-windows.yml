name: "Release (Windows)"

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "examples/**/*.png"
    tags: ["v*"]
  workflow_dispatch:

# Cancel superseded branch builds; never cancel tag (release) builds.
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/') }}
      - name: Build
        run: cargo build --release -p operow-app --locked
      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') { $ver = $env:GITHUB_REF_NAME }
          else { $ver = "develop-" + $env:GITHUB_SHA.Substring(0, 7) }
          $dir = "dist/operow-windows-x64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target/release/operow.exe $dir
          Copy-Item -Recurse examples "$dir/examples"
          Copy-Item README.md, LICENSE $dir
          $zip = "dist/operow-$ver-windows-x64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: operow-windows-x64
          path: ${{ env.ZIP_PATH }}
          retention-days: 30
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_PATH }}
